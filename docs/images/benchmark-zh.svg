<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">VoxType 流式 ASR 实测</title>
<desc id="desc">Real Doubao calls; 30 synthetic sentences repeated twice. P50/P95 transport timings exclude microphone startup and UI insertion. No competitors were benchmarked.</desc>
<style>text{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#2563eb"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#94a3b8"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="718" rx="28" fill="#ffffff" stroke="#e2e8f0"/>
<text x="48" y="62" font-size="32" fill="#111827" font-weight="700" text-anchor="start">VoxType 流式 ASR 实测</text>
<text x="48" y="99" font-size="19" fill="#64748b" font-weight="400" text-anchor="start">2026-10-24 · 30 条合成语音 × 2 · 真实接口调用</text>
<rect x="924" y="35" width="228" height="78" rx="16" fill="#eff6ff" stroke="#dbeafe"/>
<text x="1038" y="69" font-size="27" fill="#2563eb" font-weight="700" text-anchor="middle">60 / 60</text>
<text x="1038" y="95" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">请求成功</text>
<rect x="48" y="128" width="17" height="12" rx="3" fill="#2563eb" stroke="none"/>
<text x="75" y="140" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">P50</text>
<rect x="152" y="128" width="17" height="12" rx="3" fill="#38bdf8" stroke="none"/>
<text x="179" y="140" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">P95</text>
<line x1="302.0" y1="183" x2="302.0" y2="410" stroke="#e2e8f0" stroke-width="2"/>
<text x="302.0" y="169" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">0</text>
<line x1="552.0" y1="183" x2="552.0" y2="410" stroke="#e2e8f0" stroke-width="2"/>
<text x="552.0" y="169" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">500</text>
<line x1="802.0" y1="183" x2="802.0" y2="410" stroke="#e2e8f0" stroke-width="2"/>
<text x="802.0" y="169" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">1000</text>
<line x1="1052.0" y1="183" x2="1052.0" y2="410" stroke="#e2e8f0" stroke-width="2"/>
<text x="1052.0" y="169" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">1500</text>
<text x="1095" y="169" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">毫秒</text>
<text x="48" y="220" font-size="24" fill="#111827" font-weight="600" text-anchor="start">首个文本</text>
<text x="48" y="248" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">握手后的音频时间线</text>
<rect x="302" y="203" width="445.66275000033784" height="22" rx="6" fill="#2563eb" stroke="none"/>
<text x="760.6627500003378" y="221" font-size="20" fill="#111827" font-weight="600" text-anchor="start">891</text>
<rect x="302" y="236" width="646.0708395865367" height="22" rx="6" fill="#38bdf8" stroke="none"/>
<text x="961.0708395865367" y="254" font-size="20" fill="#111827" font-weight="600" text-anchor="start">1,292</text>
<text x="48" y="337" font-size="24" fill="#111827" font-weight="600" text-anchor="start">最终响应</text>
<text x="48" y="365" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">末包入队后的响应</text>
<rect x="302" y="320" width="235.46063541652984" height="22" rx="6" fill="#2563eb" stroke="none"/>
<text x="550.4606354165298" y="338" font-size="20" fill="#111827" font-weight="600" text-anchor="start">471</text>
<rect x="302" y="353" width="348.86621562291106" height="22" rx="6" fill="#38bdf8" stroke="none"/>
<text x="663.8662156229111" y="371" font-size="20" fill="#111827" font-weight="600" text-anchor="start">698</text>
<text x="48" y="457" font-size="23" fill="#111827" font-weight="600" text-anchor="start">识别错误率 · 三种单位分别统计</text>
<rect x="48" y="484" width="352" height="146" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="70" y="516" font-size="19" fill="#64748b" font-weight="400" text-anchor="start">中文 CER</text>
<text x="70" y="565" font-size="38" fill="#111827" font-weight="700" text-anchor="start">0.58%</text>
<text x="70" y="603" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">2 / 344 字</text>
<rect x="424" y="484" width="352" height="146" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="446" y="516" font-size="19" fill="#64748b" font-weight="400" text-anchor="start">英文 WER</text>
<text x="446" y="565" font-size="38" fill="#111827" font-weight="700" text-anchor="start">0.00%</text>
<text x="446" y="603" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">0 / 184 词</text>
<rect x="800" y="484" width="352" height="146" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="822" y="516" font-size="19" fill="#64748b" font-weight="400" text-anchor="start">中英混合 MER</text>
<text x="822" y="565" font-size="38" fill="#111827" font-weight="700" text-anchor="start">5.17%</text>
<text x="822" y="603" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">12 / 232 混合单位</text>
<text x="48" y="672" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">ASR 传输与归并实测；不含麦克风启动和输入框落字，不是竞品对比。</text>
<text x="48" y="700" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">合成语音重复样本不代表真人总体准确率；不同错误率单位不能直接横比。</text>
</svg>
